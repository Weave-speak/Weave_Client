name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The gitleaks CLI is MIT licensed and free. The gitleaks-action wrapper is not:
      # it refuses to run for an organization without a paid licence key. Invoking the
      # binary directly gives the same scan with no licence and no third-party action
      # holding a token.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf "$url" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan working tree and full history
        run: |
          ./gitleaks dir . --redact --no-banner --exit-code 1
          ./gitleaks git . --redact --no-banner --exit-code 1

  deployment-leak:
    name: No deployment-specific values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # This repo is public, and this client is meant to connect to ANY Weave server.
      # A hostname from one person's home server has no business being in it — not as a
      # default, not as an example, not in a test fixture.
      - name: Grep for deployment fingerprints
        run: |
          set -o pipefail
          patterns='duckdns\.org|cfargotunnel|codeine\.cloud|/home/[a-z]+/(Weave|Dev_Weave)|89\.6\.[0-9]|47\.62\.[0-9]|weave-turn|n8n\.'
          if grep -rniE "$patterns" \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
               --exclude='ci.yml' . ; then
            echo "::error::Deployment-specific value found. See CONTRIBUTING.md 'Never commit'."
            exit 1
          fi
          echo "clean"

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              bad=1
            fi
          done < <(git rev-list "$base..$head")
          exit $bad

  test:
    name: Test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # npm ci needs the lockfile committed — see CONTRIBUTING.md.
      - run: npm ci
      # Separate from `npm test` so a scope error is reported as a lint failure rather than
      # buried in a test log. This exists because "current is not defined" once shipped to a
      # user in a published installer: it parsed, it built, and every test passed.
      - run: npm run lint
      - run: npm test
      # Both targets, because they are different bundles and only one is built by default.
      - run: npm run build
      - run: WEAVE_TARGET=desktop npm run build
