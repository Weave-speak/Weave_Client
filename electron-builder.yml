# Packaging for Windows.
#
# Pinned to electron-builder 26.x deliberately. The documentation site currently documents
# v27, which renames the signing configuration entirely — `win.signtoolOptions` and
# `win.azureSignOptions` collapse into a single `win.sign` union. Following the published
# docs against an installed 26.x is a confusing afternoon.

appId: io.github.weavespeak.client
productName: Weave
copyright: Copyright (c) 2026 The Weave contributors

directories:
  output: release
  buildResources: build

# Only what the app actually runs. The renderer is built separately by vite; source, tests
# and development harnesses have no business inside a shipped binary.
files:
  - electron/**/*
  - dist-electron/renderer/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

  # REQUIRED while we ship unsigned, and it must flip to true the day we start signing.
  #
  # electron-updater verifies a downloaded installer's Authenticode signature against the
  # publisher name before running it, and defaults to doing so. An unsigned build has no
  # signature to check, so leaving this on would make every update fail verification and be
  # discarded — the app would report an update error forever and never move a version.
  # Turning it off is not a shortcut: it is the honest consequence of an unsigned build, and
  # it is exactly what signing later buys back.
  verifyUpdateCodeSignature: false

  # publisherName belongs under signtoolOptions in 26.x, not at this level. Recorded here
  # because v28 will treat a missing publisher name as a verification failure rather than a
  # warning, so this is the line that will need a certificate behind it.
  signtoolOptions:
    publisherName: Weave

nsis:
  # An assisted wizard rather than a one-click install. `allowToChangeInstallationDirectory`
  # is ignored unless oneClick is false, which is a quiet way to lose the directory page.
  oneClick: false
  allowToChangeInstallationDirectory: true

  # Per-user by default, and this is not a cosmetic choice: a per-machine install runs its
  # updater elevated, so every single update would raise a UAC prompt. That is incompatible
  # with updating quietly behind the login screen. The wizard still offers per-machine for
  # anyone who wants it — they just accept the prompt.
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: true

  # NSIS appends the app folder if the chosen path does not already contain it, so picking
  # D:\Apps lands the app in D:\Apps\Weave. The uninstaller is written into that same
  # directory as "Uninstall Weave.exe", which is exactly what we want and needs no help.
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Weave
  runAfterFinish: true
  deleteAppDataOnUninstall: false

  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeaderIcon: build/icon.ico

  artifactName: Weave-Setup-${version}.${ext}
  uninstallDisplayName: Weave

# GitHub Releases. Public, free, no rate limit that matters for an update feed, and
# usefully independent of the Cloudflare tunnel — so a tunnel outage cannot break updates
# or hide the logs explaining why.
publish:
  provider: github
  owner: Weave-speak
  repo: Weave_Client
  # Published and downloadable, but flagged pre-release. A draft would not be reachable
  # without a GitHub login, and this needs to be something a person can just download.
  releaseType: prerelease
